<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — Atomic Diets</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="logo">⚛ Atomic<span>Diets</span></div>
    <h2 id="authTitle">Welcome back</h2>
    <p class="sub" id="authSub">Sign in to access your health report</p>

    <div class="auth-form" id="authForm">
      <input type="email" class="auth-input" id="emailInput" placeholder="Email address"/>
      <input type="password" class="auth-input" id="passwordInput" placeholder="Password"/>
      <div id="nameField" style="display:none">
        <input type="text" class="auth-input" id="nameInput" placeholder="Your first name" style="width:100%"/>
      </div>
      <button class="auth-btn" onclick="handleEmailAuth()" id="mainBtn">Sign In</button>
      <div class="auth-divider">or</div>
      <button class="google-btn" onclick="handleGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>
    </div>

    <div class="auth-switch" id="authSwitch">
      Don't have an account? <a href="#" onclick="toggleMode()">Sign up free</a>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBK95ICYTN4wmd6u_mpmA5oSUu8wL-y74E",
    authDomain: "atomic-diets.firebaseapp.com",
    projectId: "atomic-diets",
    storageBucket: "atomic-diets.firebasestorage.app",
    messagingSenderId: "580888855219",
    appId: "1:580888855219:web:82c3d6e914ad9ecaebe6c6"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  async function afterLogin(user) {
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) {
      await setDoc(doc(db, 'users', user.uid), {
        email: user.email,
        name: user.displayName || '',
        isPro: false,
        createdAt: new Date().toISOString()
      });
    }
    const params = new URLSearchParams(window.location.search);
    const next = params.get('next');
    if (next === 'checkout') {
      window.location.href = 'report.html';
    } else {
      const userData = snap.exists() ? snap.data() : {};
      window.location.href = userData.isPro ? 'dashboard.html' : 'report.html';
    }
  }

  let isSignup = false;

  window.toggleMode = () => {
    isSignup = !isSignup;
    document.getElementById('authTitle').textContent = isSignup ? 'Create your account' : 'Welcome back';
    document.getElementById('authSub').textContent = isSignup ? 'Start with a free health report' : 'Sign in to access your health report';
    document.getElementById('mainBtn').textContent = isSignup ? 'Create Account' : 'Sign In';
    document.getElementById('nameField').style.display = isSignup ? 'block' : 'none';
    document.getElementById('authSwitch').innerHTML = isSignup
      ? 'Already have an account? <a href="#" onclick="toggleMode()">Sign in</a>'
      : "Don't have an account? <a href=\"#\" onclick=\"toggleMode()\">Sign up free</a>";
  };

  window.handleEmailAuth = async () => {
    const email = document.getElementById('emailInput').value.trim();
    const password = document.getElementById('passwordInput').value;
    const btn = document.getElementById('mainBtn');
    if (!email || !password) { showToast('Please fill all fields'); return; }
    btn.textContent = 'Please wait...'; btn.disabled = true;
    try {
      if (isSignup) {
        const name = document.getElementById('nameInput').value.trim();
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        await updateProfile(cred.user, { displayName: name });
        await afterLogin(cred.user);
      } else {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        await afterLogin(cred.user);
      }
    } catch (e) {
      const msgs = {
        'auth/wrong-password': 'Incorrect password',
        'auth/user-not-found': 'No account with that email',
        'auth/email-already-in-use': 'Email already registered',
        'auth/weak-password': 'Password must be 6+ characters',
        'auth/invalid-email': 'Invalid email address'
      };
      showToast(msgs[e.code] || 'Error: ' + e.message);
      btn.textContent = isSignup ? 'Create Account' : 'Sign In';
      btn.disabled = false;
    }
  };

  window.handleGoogle = async () => {
    try {
      const result = await signInWithPopup(auth, provider);
      await afterLogin(result.user);
    } catch (e) {
      showToast('Google sign-in failed. Try again.');
    }
  };

  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
